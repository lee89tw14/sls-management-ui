name: 'Node build'
description: 'Install, lint, test and build the web app'
inputs:
  node-version:
    required: true
    description: 'Version Spec of the version to use. Examples: 22, 22.12.0, >=22.12.0.'
  working-directory:
    default: 'html/'
    description: 'Working directory'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: html/package-lock.json

    - name: Install Dependencies
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Audit runtime dependencies
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm audit --omit=dev --audit-level=high

    - name: Lint
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm run lint

    - name: Test
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm test

    - name: Build App
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm run build
