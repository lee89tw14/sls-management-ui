name: 'Node build'
description: 'Install, lint, test and build the web app'
inputs:
  node-version:
    required: true
    description: 'Version Spec of the version to use. Examples: 22, 22.13.0, >=22.13.0.'
  working-directory:
    default: 'html/'
    description: 'Working directory'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: html/package-lock.json

    - name: Install Dependencies
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Lint
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm run lint

    - name: Test
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm test

    - name: Build App
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      run: npm run build
