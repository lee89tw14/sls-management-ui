name: 'Release'

on:
  release:
    types: [ published ]

env:
  docker_repo: 'ghcr.io'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # ghcr.io/<owner>/<repo>, lower-cased: works for upstream and for forks.
      - name: Image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Node Build
        uses: ./.github/actions/node-build
        with:
          node-version: 22

      - name: Docker Build
        uses: ./.github/actions/docker-build
        with:
          repository: ${{ env.docker_repo }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ steps.image.outputs.name }}
          push: true
