services:
  node:
    build:
      context: .
      dockerfile: docker/development.Dockerfile
    volumes:
      - ./html:/app
    environment:
      APP_URL: "${APP_URL:-}"
      API_HOST: "${API_HOST:-}"
      STATS_HOST: "${STATS_HOST:-}"
      SRT_HOST: "${SRT_HOST:-}"
      SRT_PLAYER_PORT: "${SRT_PLAYER_PORT:-4000}"
      SRT_SENDER_PORT: "${SRT_SENDER_PORT:-4001}"
      SLS_STATS_PORT: "${SLS_STATS_PORT:-8080}"
      SRTLA_PORT: "${SRTLA_PORT:-}"
      DEV_ALLOWED_HOSTS: "${DEV_ALLOWED_HOSTS:-}"
    ports:
      - "3000:3000"
